risk-engine {
  kafka {
    bootstrap-servers = "kafka:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    topic = "transactions.created"
    topic = ${?KAFKA_TOPIC}
  }

  postgres {
    url = "jdbc:postgresql://postgres:5432/frauddetection"
    url = ${?POSTGRES_URL}
    user = "postgres"
    user = ${?POSTGRES_USER}
    password = "postgres"
    password = ${?POSTGRES_PASSWORD}
  }

  # All thresholds below are intentionally externalized so scoring can be tuned without a
  # code change / recompile. Each rule's point weight controls how much it contributes to
  # the 0-100 risk score; a transaction is Flagged once the total crosses flag-threshold.
  rules {
    large-amount-threshold = 5000.0
    very-large-amount-threshold = 10000.0
    velocity-window-seconds = 600
    velocity-count-threshold = 3
    escalation-multiplier = 5.0
    frequency-multiplier = 3.0
    risky-countries = ["RU", "NG", "KP", "IR", "BR"]
    risky-categories = ["Electronics", "Gaming"]
    risky-category-amount-threshold = 3000.0
    flag-threshold = 40

    weights {
      large-amount = 25
      very-large-amount = 45
      risky-country = 20
      velocity = 35
      escalation = 30
      frequency = 25
      risky-category = 15
    }
  }

  processing {
    trigger-interval-seconds = 5
    checkpoint-location = "/tmp/spark-checkpoints/risk-engine"
    checkpoint-location = ${?CHECKPOINT_LOCATION}
  }
}
